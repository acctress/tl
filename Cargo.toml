[package]
name = "tl"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/tl-parser", "crates/tl-analyser", "crates/tl-vm"]

[dependencies]
clap = { version = "4", features = ["derive"] }
tl-parser   = { path = "crates/tl-parser" }
tl-analyser = { path = "crates/tl-analyser" }
tl-vm = { path = "crates/tl-vm"}
